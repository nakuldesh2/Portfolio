name: Deploy Portfolio to GitHub Pages

# Trigger deployment when we push to main branch
on:
  push:
    branches: [main, master, claude/github-portfolio-project-opbvb5]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: Checkout code from repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Setup Node.js environment
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Step 4: Build the React app
      - name: Build portfolio
        run: npm run build
        env:
          # Groq API key not needed for build
          # (It's only used at runtime in browser)
          CI: false

      # Step 5: Upload and Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git fetch origin main
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git rm -rf . 2>/dev/null || true
          cp -r dist/* .
          git add -A
          git commit -m "Deploy $(date)" || echo "No changes"
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages --force
