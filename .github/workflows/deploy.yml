name: Deploy Portfolio to GitHub Pages

# Trigger deployment when we push to main branch
on:
  push:
    branches: [main, master, claude/github-portfolio-project-opbvb5]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: Checkout code from repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Setup Node.js environment
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Step 4: Build the React app
      - name: Build portfolio
        run: npm run build
        env:
          # Groq API key not needed for build
          # (It's only used at runtime in browser)
          CI: false

      # Step 5: Deploy to GitHub Pages (docs folder)
      - name: Deploy to GitHub Pages
        run: |
          rm -rf docs
          cp -r dist docs
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add docs/
          git commit -m "Deploy: update docs folder $(date)" || echo "No changes to commit"
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
