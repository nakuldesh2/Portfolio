name: Deploy Portfolio to GitHub Pages

# Trigger deployment when we push to main branch
on:
  push:
    branches: [main, master, claude/github-portfolio-project-opbvb5]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # Step 1: Checkout code from repository
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Step 2: Setup Node.js environment
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Step 4: Build the React app
      - name: Build portfolio
        run: npm run build
        env:
          # Groq API key not needed for build
          # (It's only used at runtime in browser)
          CI: false

      # Step 5: Upload and deploy to GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
