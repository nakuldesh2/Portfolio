name: Deploy Portfolio to GitHub Pages

# Trigger deployment when we push to main branch
on:
  push:
    branches: [main, master, claude/github-portfolio-project-opbvb5]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code from repository
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Step 2: Setup Node.js environment
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Step 4: Build the React app
      - name: Build portfolio
        run: npm run build
        env:
          # Groq API key not needed for build
          # (It's only used at runtime in browser)
          CI: false

      # Step 5: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Create temporary directory for gh-pages content
          mkdir -p /tmp/gh-pages
          cp -r dist/* /tmp/gh-pages/

          # Checkout/create gh-pages branch
          git fetch origin gh-pages --depth=1 2>/dev/null || echo "gh-pages branch does not exist yet"
          git checkout --orphan gh-pages 2>/dev/null || git checkout gh-pages

          # Remove all files and add only dist contents
          git rm -rf . 2>/dev/null || true
          cp -r /tmp/gh-pages/* .

          # Commit and push
          git add .
          git commit -m "Deploy: $(date)" || echo "No changes to commit"
          git push -f https://x-access-token:${GITHUB_TOKEN}@github.com/nakuldesh2/Portfolio.git gh-pages
