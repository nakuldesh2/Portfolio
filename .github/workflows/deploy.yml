name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build portfolio
        run: npm run build
        env:
          CI: false

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          cname: false

      - name: Configure Pages Source
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              // Try to update existing Pages site
              await github.rest.repos.updateInformationAboutPagesSite({
                owner: 'nakuldesh2',
                repo: 'Portfolio',
                source: {
                  branch: 'gh-pages',
                  path: '/'
                }
              });
              console.log('Updated existing Pages site');
            } catch (err) {
              // If update failed (404), create new Pages site
              if (err.status === 404) {
                await github.rest.repos.createPagesSite({
                  owner: 'nakuldesh2',
                  repo: 'Portfolio',
                  source: {
                    branch: 'gh-pages',
                    path: '/'
                  }
                });
                console.log('Created new Pages site');
              } else {
                throw err;
              }
            }
