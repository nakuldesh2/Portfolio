<svg viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-size: 28px; font-weight: bold; fill: #ffffff; }
    .subtitle { font-size: 14px; fill: #06B6D4; }
    .section-title { font-size: 13px; font-weight: bold; fill: #06B6D4; }
    .label { font-size: 12px; font-weight: bold; fill: #ffffff; }
    .text { font-size: 11px; fill: #ffffff; }
    .box { stroke: #4B5563; stroke-width: 2; rx: 6; }
  </style>
  <rect width="1400" height="700" fill="#111827"/>
  <text x="700" y="40" class="title" text-anchor="middle">Synthetic Canary Monitoring</text>
  <text x="700" y="60" class="subtitle" text-anchor="middle">Real-time health checks simulating customer transactions every 60 seconds</text>
  
  <!-- Main Flow -->
  <rect x="60" y="100" width="120" height="80" fill="#3B82F6" class="box"/><text x="120" y="140" class="label" text-anchor="middle">Canary Probe</text><text x="120" y="160" class="text" text-anchor="middle">Triggers</text>
  <path d="M 180 140 L 240 140" stroke="#06B6D4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="240" y="100" width="120" height="80" fill="#8B5CF6" class="box"/><text x="300" y="140" class="label" text-anchor="middle">API Health</text><text x="300" y="160" class="text" text-anchor="middle">Check</text>
  <path d="M 360 140 L 420 140" stroke="#06B6D4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="420" y="100" width="120" height="80" fill="#EC4899" class="box"/><text x="480" y="140" class="label" text-anchor="middle">Database</text><text x="480" y="160" class="text" text-anchor="middle">Query</text>
  <path d="M 540 140 L 600 140" stroke="#06B6D4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="600" y="100" width="120" height="80" fill="#F59E0B" class="box"/><text x="660" y="140" class="label" text-anchor="middle">Response</text><text x="660" y="160" class="text" text-anchor="middle">Validation</text>
  <path d="M 720 140 L 780 140" stroke="#06B6D4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="780" y="100" width="120" height="80" fill="#10B981" class="box"/><text x="840" y="140" class="label" text-anchor="middle">CloudWatch</text><text x="840" y="160" class="text" text-anchor="middle">Metrics</text>
  <path d="M 900 140 L 960 140" stroke="#06B6D4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="960" y="100" width="120" height="80" fill="#06B6D4" class="box"/><text x="1020" y="140" class="label" text-anchor="middle">Alerts &</text><text x="1020" y="160" class="text" text-anchor="middle">Dashboards</text>
  
  <!-- Details -->
  <g>
    <rect x="50" y="240" width="1300" height="420" fill="#1F2937" class="box" stroke="#06B6D4"/>
    <text x="700" y="270" class="section-title" text-anchor="middle">Monitoring Strategy & Key Metrics</text>
    
    <rect x="70" y="290" width="400" height="140" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" rx="4"/>
    <text x="270" y="315" class="section-title" text-anchor="middle">Continuous Probe Execution</text>
    <text x="80" y="340" class="text">✓ Every 60 seconds: Synthetic transaction</text>
    <text x="80" y="358" class="text">✓ Simulates real user behavior</text>
    <text x="80" y="376" class="text">✓ Checks: Response time, error rate, data</text>
    <text x="80" y="394" class="text">✓ Detects degradation BEFORE users see it</text>
    <text x="80" y="412" class="text">✓ Captures baseline performance metrics</text>
    
    <rect x="510" y="290" width="400" height="140" fill="#0F172A" stroke="#EC4899" stroke-width="1.5" rx="4"/>
    <text x="710" y="315" class="section-title" text-anchor="middle">Key Metrics Tracked</text>
    <text x="520" y="340" class="text">• P99 Latency: Target < 1 second</text>
    <text x="520" y="358" class="text">• Error Rate: Target < 0.1%</text>
    <text x="520" y="376" class="text">• Database Connection: Timeout checks</text>
    <text x="520" y="394" class="text">• Response Validity: Data integrity</text>
    <text x="520" y="412" class="text">• Availability: Uptime percentage</text>
    
    <rect x="950" y="290" width="380" height="140" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" rx="4"/>
    <text x="1140" y="315" class="section-title" text-anchor="middle">Alert Thresholds</text>
    <text x="960" y="340" class="text">P99 > 1s → Page on-call engineer</text>
    <text x="960" y="358" class="text">Error Rate > 1% → Critical alert</text>
    <text x="960" y="376" class="text">DB Connection timeout → Immediate page</text>
    <text x="960" y="394" class="text">Availability drop → High priority alert</text>
    <text x="960" y="412" class="text">Multiple failures → Escalation</text>
    
    <rect x="70" y="460" width="1260" height="160" fill="#0F172A" stroke="#10B981" stroke-width="1.5" rx="4"/>
    <text x="700" y="485" class="section-title" text-anchor="middle">Benefits & SLA Protection</text>
    <text x="80" y="515" class="text">Early Warning System: Detects issues 5-10 minutes before customers report them, enabling proactive response</text>
    <text x="80" y="535" class="text">SLA Compliance: Maintains uptime SLAs by catching degradation before threshold breaches</text>
    <text x="80" y="555" class="text">Root Cause Isolation: Canary probes run from multiple regions, identifying geographic/component failures</text>
    <text x="80" y="575" class="text">Historical Baselines: 60-second granularity creates detailed performance history for trend analysis</text>
  </g>
  
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0 0, 12 6, 0 12" fill="#06B6D4"/></marker></defs>
</svg>
