<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">Large-Scale Data Deletion Pipeline</text>
  <text x="600" y="55" font-size="14" text-anchor="middle" fill="#06B6D4">Safely delete ~9 Billion records and ~17 PB of S3 data within 5 days</text>
  
  <g><rect x="30" y="100" width="130" height="100" fill="#3B82F6" stroke="#4B5563" stroke-width="2" rx="8"/><text x="95" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">DynamoDB Export</text><text x="95" y="170" font-size="10" text-anchor="middle" fill="#ffffff">9B records</text></g>
  <path d="M 160 150 L 210 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="210" y="100" width="130" height="100" fill="#8B5CF6" stroke="#4B5563" stroke-width="2" rx="8"/><text x="275" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Filter & Validate</text><text x="275" y="170" font-size="10" text-anchor="middle" fill="#ffffff">Decommissioned</text></g>
  <path d="M 340 150 L 390 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="390" y="100" width="130" height="100" fill="#EC4899" stroke="#4B5563" stroke-width="2" rx="8"/><text x="455" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Deletion Manifest</text><text x="455" y="170" font-size="10" text-anchor="middle" fill="#ffffff">Approved records</text></g>
  <path d="M 520 150 L 570 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="570" y="100" width="130" height="100" fill="#F59E0B" stroke="#4B5563" stroke-width="2" rx="8"/><text x="635" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">SQS Queue</text><text x="635" y="170" font-size="10" text-anchor="middle" fill="#ffffff">Async processing</text></g>
  <path d="M 700 150 L 750 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="750" y="100" width="130" height="100" fill="#10B981" stroke="#4B5563" stroke-width="2" rx="8"/><text x="815" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Lambda Workers</text><text x="815" y="170" font-size="10" text-anchor="middle" fill="#ffffff">50 concurrent</text></g>
  <path d="M 880 150 L 930 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="930" y="100" width="130" height="100" fill="#06B6D4" stroke="#4B5563" stroke-width="2" rx="8"/><text x="995" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Deletion API</text><text x="995" y="170" font-size="10" text-anchor="middle" fill="#ffffff">Trusted logic</text></g>
  
  <g><rect x="390" y="280" width="130" height="100" fill="#8B5CF6" stroke="#4B5563" stroke-width="2" rx="8"/><text x="455" y="310" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Glacier Retention</text><text x="455" y="350" font-size="10" text-anchor="middle" fill="#ffffff">18 month recovery</text></g>
  <path d="M 275 200 L 455 280" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  
  <g><rect x="30" y="280" width="320" height="260" fill="#1F2937" stroke="#06B6D4" stroke-width="2" rx="8"/><text x="190" y="305" font-size="12" font-weight="bold" text-anchor="middle" fill="#06B6D4">Scale & Capacity</text><text x="50" y="330" font-size="11" font-weight="bold" fill="#10B981">Throughput:</text><text x="60" y="348" font-size="10" fill="#ffffff">20,833 records/second</text><text x="50" y="370" font-size="11" font-weight="bold" fill="#10B981">DynamoDB Writes:</text><text x="60" y="388" font-size="10" fill="#ffffff">Batch size: 25</text><text x="60" y="403" font-size="10" fill="#ffffff">~134K WCU required</text><text x="50" y="425" font-size="11" font-weight="bold" fill="#10B981">Lambda Concurrency:</text><text x="60" y="443" font-size="10" fill="#ffffff">50 concurrent workers</text><text x="50" y="465" font-size="11" font-weight="bold" fill="#10B981">S3 Data:</text><text x="60" y="483" font-size="10" fill="#ffffff">17 PB to delete</text><text x="60" y="498" font-size="10" fill="#ffffff">Controlled deletion</text></g>
  
  <g><rect x="570" y="280" width="350" height="260" fill="#1F2937" stroke="#10B981" stroke-width="2" rx="8"/><text x="745" y="305" font-size="12" font-weight="bold" text-anchor="middle" fill="#10B981">Governance & Safety</text><text x="590" y="330" font-size="11" font-weight="bold" fill="#10B981">✓ Validations:</text><text x="600" y="348" font-size="10" fill="#ffffff">Asset type verification</text><text x="600" y="363" font-size="10" fill="#ffffff">Timestamp cutoff checks</text><text x="590" y="385" font-size="11" font-weight="bold" fill="#10B981">✓ Safeguards:</text><text x="600" y="403" font-size="10" fill="#ffffff">Allow-list assets only</text><text x="600" y="418" font-size="10" fill="#ffffff">Decommissioned check</text><text x="590" y="440" font-size="11" font-weight="bold" fill="#10B981">✓ Monitoring:</text><text x="600" y="458" font-size="10" fill="#ffffff">CloudWatch dashboards</text><text x="600" y="473" font-size="10" fill="#ffffff">DLQ for failed messages</text><text x="600" y="488" font-size="10" fill="#ffffff">Audit trail logging</text></g>
  
  <defs><marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0 0, 12 6, 0 12" fill="#06B6D4"/></marker></defs>
</svg>
