<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">AI-Assisted Onboarding Agent</text>
  <text x="600" y="55" font-size="14" text-anchor="middle" fill="#06B6D4">LLM-powered automation of 20-30 support tickets per day</text>
  
  <g><rect x="50" y="100" width="140" height="100" fill="#3B82F6" stroke="#4B5563" stroke-width="2" rx="8"/><text x="120" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Support Ticket</text><text x="120" y="170" font-size="10" text-anchor="middle" fill="#ffffff">20-30/day</text></g>
  <path d="M 190 150 L 250 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="250" y="100" width="140" height="100" fill="#8B5CF6" stroke="#4B5563" stroke-width="2" rx="8"/><text x="320" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">RAG System</text><text x="320" y="150" font-size="11" text-anchor="middle" fill="#ffffff">Knowledge</text><text x="320" y="168" font-size="10" text-anchor="middle" fill="#ffffff">Retrieval</text></g>
  <path d="M 390 150 L 450 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="450" y="100" width="140" height="100" fill="#EC4899" stroke="#4B5563" stroke-width="2" rx="8"/><text x="520" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">LLM Inference</text><text x="520" y="150" font-size="11" text-anchor="middle" fill="#ffffff">Amazon</text><text x="520" y="168" font-size="10" text-anchor="middle" fill="#ffffff">Bedrock</text></g>
  <path d="M 590 150 L 650 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="650" y="100" width="140" height="100" fill="#F59E0B" stroke="#4B5563" stroke-width="2" rx="8"/><text x="720" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Validation</text><text x="720" y="150" font-size="11" text-anchor="middle" fill="#ffffff">Deterministic</text><text x="720" y="168" font-size="10" text-anchor="middle" fill="#ffffff">Checks</text></g>
  <path d="M 790 150 L 850 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="850" y="100" width="140" height="100" fill="#10B981" stroke="#4B5563" stroke-width="2" rx="8"/><text x="920" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Automated</text><text x="920" y="150" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Response</text><text x="920" y="168" font-size="10" text-anchor="middle" fill="#ffffff">via Slack</text></g>
  
  <g><rect x="50" y="280" width="900" height="260" fill="#1F2937" stroke="#06B6D4" stroke-width="2" rx="8"/><text x="500" y="305" font-size="13" font-weight="bold" text-anchor="middle" fill="#06B6D4">Key Components & Benefits</text>
    <text x="70" y="335" font-size="11" font-weight="bold" fill="#06B6D4">RAG (Retrieval-Augmented Generation)</text>
    <text x="80" y="353" font-size="10" fill="#ffffff">Grounds LLM answers in real company knowledge base</text>
    <text x="80" y="368" font-size="10" fill="#ffffff">Prevents hallucinations with factual data</text>
    
    <text x="70" y="395" font-size="11" font-weight="bold" fill="#06B6D4">Deterministic Validation Layers</text>
    <text x="80" y="413" font-size="10" fill="#ffffff">Rule-based checks ensure safety and compliance</text>
    <text x="80" y="428" font-size="10" fill="#ffffff">Only approved responses are sent</text>
    
    <text x="70" y="455" font-size="11" font-weight="bold" fill="#06B6D4">Business Impact</text>
    <text x="80" y="473" font-size="10" fill="#ffffff">✓ Automates 20-30 tickets per day (60-90/week)</text>
    <text x="80" y="488" font-size="10" fill="#ffffff">✓ Frees up support team for complex issues</text>
    <text x="80" y="503" font-size="10" fill="#ffffff">✓ 24/7 automated responses improve customer satisfaction</text>
    <text x="80" y="518" font-size="10" fill="#ffffff">✓ LLM + Deterministic = Safe automation</text></g>
  
  <defs><marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0 0, 12 6, 0 12" fill="#06B6D4"/></marker></defs>
</svg>
