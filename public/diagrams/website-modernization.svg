<svg viewBox="0 0 1200 550" xmlns="http://www.w3.org/2000/svg">
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">Website Modernization</text>
  <text x="600" y="55" font-size="14" text-anchor="middle" fill="#06B6D4">Migration from monolithic legacy system to modern microservices</text>
  
  <g><rect x="50" y="100" width="140" height="100" fill="#8B5A3C" stroke="#4B5563" stroke-width="2" rx="8"/><text x="120" y="135" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Legacy</text><text x="120" y="155" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Monolith</text><text x="120" y="175" font-size="10" text-anchor="middle" fill="#ffffff">15+ years old</text></g>
  
  <path d="M 190 150 L 250 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="220" y="140" font-size="11" fill="#06B6D4" font-weight="bold">Strangler</text>
  
  <g><rect x="250" y="100" width="140" height="100" fill="#3B82F6" stroke="#4B5563" stroke-width="2" rx="8"/><text x="320" y="135" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">API Gateway</text><text x="320" y="155" font-size="11" text-anchor="middle" fill="#ffffff">Traffic routing</text><text x="320" y="175" font-size="10" text-anchor="middle" fill="#ffffff">50/50 split</text></g>
  
  <path d="M 390 130 L 450 110" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 390 170 L 450 190" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="450" y="60" width="140" height="90" fill="#10B981" stroke="#4B5563" stroke-width="2" rx="8"/><text x="520" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">New Services</text><text x="520" y="120" font-size="10" text-anchor="middle" fill="#ffffff">Kubernetes</text></g>
  
  <g><rect x="450" y="180" width="140" height="90" fill="#8B5A3C" stroke="#4B5563" stroke-width="2" rx="8"/><text x="520" y="220" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Legacy System</text><text x="520" y="240" font-size="10" text-anchor="middle" fill="#ffffff">Still running</text></g>
  
  <g><rect x="50" y="280" width="1020" height="230" fill="#1F2937" stroke="#06B6D4" stroke-width="2" rx="8"/><text x="560" y="305" font-size="13" font-weight="bold" text-anchor="middle" fill="#06B6D4">Strangler Pattern Strategy</text>
    <text x="70" y="340" font-size="11" font-weight="bold" fill="#06B6D4">Phase 1: New infrastructure ready</text>
    <text x="80" y="358" font-size="10" fill="#ffffff">Deploy modern services to Kubernetes cluster</text>
    <text x="80" y="373" font-size="10" fill="#ffffff">Set up data sync between old and new systems</text>
    
    <text x="70" y="400" font-size="11" font-weight="bold" fill="#06B6D4">Phase 2: Gradual traffic shift</text>
    <text x="80" y="418" font-size="10" fill="#ffffff">Route 10% → 25% → 50% → 75% → 100% to new services</text>
    <text x="80" y="433" font-size="10" fill="#ffffff">Monitor metrics at each step, rollback if needed</text>
    
    <text x="70" y="460" font-size="11" font-weight="bold" fill="#06B6D4">Phase 3: Decommission legacy</text>
    <text x="80" y="478" font-size="10" fill="#ffffff">Once fully migrated, shut down old monolith</text></g>
  
  <defs><marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0 0, 12 6, 0 12" fill="#06B6D4"/></marker></defs>
</svg>
