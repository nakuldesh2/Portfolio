<svg viewBox="0 0 1200 550" xmlns="http://www.w3.org/2000/svg">
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">Newsstand Integration Platform</text>
  <text x="600" y="55" font-size="14" text-anchor="middle" fill="#06B6D4">Real-time content distribution to digital newsstand</text>
  
  <g><rect x="50" y="100" width="120" height="80" fill="#3B82F6" stroke="#4B5563" stroke-width="2" rx="8"/><text x="110" y="135" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Content</text><text x="110" y="155" font-size="10" text-anchor="middle" fill="#ffffff">Publishers</text></g>
  <path d="M 170 140 L 230 140" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="230" y="100" width="120" height="80" fill="#8B5CF6" stroke="#4B5563" stroke-width="2" rx="8"/><text x="290" y="135" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Content</text><text x="290" y="155" font-size="10" text-anchor="middle" fill="#ffffff">Ingestion</text></g>
  <path d="M 350 140 L 410 140" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="410" y="100" width="120" height="80" fill="#EC4899" stroke="#4B5563" stroke-width="2" rx="8"/><text x="470" y="135" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Processing</text><text x="470" y="155" font-size="10" text-anchor="middle" fill="#ffffff">Pipeline</text></g>
  <path d="M 530 140 L 590 140" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="590" y="100" width="120" height="80" fill="#F59E0B" stroke="#4B5563" stroke-width="2" rx="8"/><text x="650" y="135" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Distribution</text><text x="650" y="155" font-size="10" text-anchor="middle" fill="#ffffff">Queue</text></g>
  <path d="M 710 140 L 770 140" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="770" y="100" width="120" height="80" fill="#10B981" stroke="#4B5563" stroke-width="2" rx="8"/><text x="830" y="135" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Newsstand</text><text x="830" y="155" font-size="10" text-anchor="middle" fill="#ffffff">Platform</text></g>
  <path d="M 890 140 L 950 140" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="950" y="100" width="120" height="80" fill="#06B6D4" stroke="#4B5563" stroke-width="2" rx="8"/><text x="1010" y="135" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">End Users</text><text x="1010" y="155" font-size="10" text-anchor="middle" fill="#ffffff">Apps</text></g>
  
  <g><rect x="50" y="250" width="1020" height="260" fill="#1F2937" stroke="#06B6D4" stroke-width="2" rx="8"/><text x="560" y="275" font-size="13" font-weight="bold" text-anchor="middle" fill="#06B6D4">Real-Time Content Distribution Architecture</text>
    <text x="70" y="310" font-size="11" font-weight="bold" fill="#06B6D4">Content Ingestion</text>
    <text x="80" y="328" font-size="10" fill="#ffffff">• Publishers upload content to secure content ingestion platform</text>
    <text x="80" y="343" font-size="10" fill="#ffffff">• Automated metadata extraction and validation</text>
    
    <text x="70" y="370" font-size="11" font-weight="bold" fill="#06B6D4">Processing & Optimization</text>
    <text x="80" y="388" font-size="10" fill="#ffffff">• Image optimization, format conversion for multiple devices</text>
    <text x="80" y="403" font-size="10" fill="#ffffff">• Content enrichment with metadata and relationships</text>
    
    <text x="70" y="430" font-size="11" font-weight="bold" fill="#06B6D4">Distribution</text>
    <text x="80" y="448" font-size="10" fill="#ffffff">• Queue-based delivery ensures reliable distribution</text>
    <text x="80" y="463" font-size="10" fill="#ffffff">• Multi-region deployment for low latency</text>
    <text x="80" y="478" font-size="10" fill="#ffffff">• Real-time updates push to user apps</text></g>
  
  <defs><marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0 0, 12 6, 0 12" fill="#06B6D4"/></marker></defs>
</svg>
