  <path d="M 680 160 L 730 160" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="730" y="120" width="120" height="80" fill="#06B6D4" stroke="#4B5563" stroke-width="2" rx="8"/><text x="790" y="155" font-size="11" text-anchor="middle" fill="#ffffff">Home Dir Access</text></g>
  
