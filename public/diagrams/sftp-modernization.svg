  <g><rect x="50" y="450" width="900" height="160" fill="#1F2937" stroke="#06B6D4" stroke-width="2" rx="8"/><text x="500" y="475" font-size="13" font-weight="bold" text-anchor="middle" fill="#06B6D4">OIDC Authentication with Federated Identity (Enterprise IdP)</text><text x="50" y="505" font-size="11" font-weight="bold" fill="#10B981">Authentication Flow:</text><text x="60" y="523" font-size="10" fill="#ffffff">User → Route 53 (DNS) → Enterprise OIDC → Cognito Exchange → AWS Transfer Family → SFTP Home Dir</text><text x="50" y="545" font-size="11" font-weight="bold" fill="#10B981">Key Features:</text><text x="60" y="563" font-size="10" fill="#ffffff">✓ OIDC Authorization Code Flow  ✓ MFA enforced at IdP level  ✓ Automatic access revocation</text><text x="60" y="581" font-size="10" fill="#ffffff">✓ Aligned with enterprise compliance  ✓ 2,784 users successfully migrated with zero downtime</text></g>
  
  <defs><marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0 0, 12 6, 0 12" fill="#06B6D4"/></marker></defs>
