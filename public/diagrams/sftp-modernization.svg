  <g><rect x="50" y="300" width="100" height="80" fill="#3B82F6" stroke="#4B5563" stroke-width="2" rx="8"/><text x="100" y="335" font-size="11" text-anchor="middle" fill="#ffffff">User Login</text><text x="100" y="352" font-size="10" text-anchor="middle" fill="#ffffff">2,784 users</text></g>
  <path d="M 150 340 L 200 340" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
