<svg viewBox="0 0 1200 550" xmlns="http://www.w3.org/2000/svg">
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">DAS → CAS Compatibility Layer</text>
  <text x="600" y="55" font-size="14" text-anchor="middle" fill="#06B6D4">Bridge legacy DAS content to modern CAS platform</text>
  
  <g><rect x="50" y="100" width="130" height="100" fill="#8B5A3C" stroke="#4B5563" stroke-width="2" rx="8"/><text x="115" y="135" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Legacy DAS</text><text x="115" y="155" font-size="11" text-anchor="middle" fill="#ffffff">Content</text><text x="115" y="175" font-size="10" text-anchor="middle" fill="#ffffff">Deprecated</text></g>
  
  <path d="M 180 150 L 240 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="240" y="100" width="130" height="100" fill="#3B82F6" stroke="#4B5563" stroke-width="2" rx="8"/><text x="305" y="135" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Compatibility</text><text x="305" y="155" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Layer</text><text x="305" y="175" font-size="10" text-anchor="middle" fill="#ffffff">Transform</text></g>
  
  <path d="M 370 150 L 430 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="430" y="100" width="130" height="100" fill="#8B5CF6" stroke="#4B5563" stroke-width="2" rx="8"/><text x="495" y="135" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">CAS Format</text><text x="495" y="155" font-size="11" text-anchor="middle" fill="#ffffff">Conversion</text><text x="495" y="175" font-size="10" text-anchor="middle" fill="#ffffff">Reformat</text></g>
  
  <path d="M 560 150 L 620 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="620" y="100" width="130" height="100" fill="#10B981" stroke="#4B5563" stroke-width="2" rx="8"/><text x="685" y="135" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">CAS</text><text x="685" y="155" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Platform</text><text x="685" y="175" font-size="10" text-anchor="middle" fill="#ffffff">Modern</text></g>
  
  <g><rect x="50" y="280" width="1020" height="230" fill="#1F2937" stroke="#06B6D4" stroke-width="2" rx="8"/><text x="560" y="305" font-size="13" font-weight="bold" text-anchor="middle" fill="#06B6D4">Technical Approach</text>
    <text x="70" y="340" font-size="11" font-weight="bold" fill="#06B6D4">Format Mapping</text>
    <text x="80" y="358" font-size="10" fill="#ffffff">• DAS metadata → CAS metadata schema mapping</text>
    <text x="80" y="373" font-size="10" fill="#ffffff">• Preserve content integrity during conversion</text>
    
    <text x="70" y="400" font-size="11" font-weight="bold" fill="#06B6D4">API Compatibility Layer</text>
    <text x="80" y="418" font-size="10" fill="#ffffff">• Intercept DAS API calls, translate to CAS APIs</text>
    <text x="80" y="433" font-size="10" fill="#ffffff">• Maintain backward compatibility for clients</text>
    
    <text x="70" y="460" font-size="11" font-weight="bold" fill="#06B6D4">Migration Path</text>
    <text x="80" y="478" font-size="10" fill="#ffffff">Allows gradual migration without breaking existing DAS clients</text></g>
  
  <defs><marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0 0, 12 6, 0 12" fill="#06B6D4"/></marker></defs>
</svg>
