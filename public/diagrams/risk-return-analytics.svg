<svg viewBox="0 0 1200 550" xmlns="http://www.w3.org/2000/svg">
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">Risk/Return Analytics Platform</text>
  <text x="600" y="55" font-size="14" text-anchor="middle" fill="#06B6D4">Real-time portfolio risk analysis and performance metrics</text>
  
  <g><rect x="50" y="100" width="130" height="100" fill="#3B82F6" stroke="#4B5563" stroke-width="2" rx="8"/><text x="115" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Market</text><text x="115" y="150" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Data Feed</text><text x="115" y="170" font-size="10" text-anchor="middle" fill="#ffffff">Real-time prices</text></g>
  <path d="M 180 150 L 240 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="240" y="100" width="130" height="100" fill="#8B5CF6" stroke="#4B5563" stroke-width="2" rx="8"/><text x="305" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Time Series</text><text x="305" y="150" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Database</text><text x="305" y="170" font-size="10" text-anchor="middle" fill="#ffffff">High throughput</text></g>
  <path d="M 370 150 L 430 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="430" y="100" width="130" height="100" fill="#EC4899" stroke="#4B5563" stroke-width="2" rx="8"/><text x="495" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Analytics</text><text x="495" y="150" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Engine</text><text x="495" y="170" font-size="10" text-anchor="middle" fill="#ffffff">Risk models</text></g>
  <path d="M 560 150 L 620 150" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <g><rect x="620" y="100" width="130" height="100" fill="#F59E0B" stroke="#4B5563" stroke-width="2" rx="8"/><text x="685" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Reporting &</text><text x="685" y="150" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Dashboards</text><text x="685" y="170" font-size="10" text-anchor="middle" fill="#ffffff">Portfolio view</text></g>
  
  <g><rect x="850" y="100" width="130" height="100" fill="#10B981" stroke="#4B5563" stroke-width="2" rx="8"/><text x="915" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Risk Alerts &</text><text x="915" y="150" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Notifications</text><text x="915" y="170" font-size="10" text-anchor="middle" fill="#ffffff">Threshold-based</text></g>
  
  <g><rect x="50" y="280" width="1020" height="230" fill="#1F2937" stroke="#06B6D4" stroke-width="2" rx="8"/><text x="560" y="305" font-size="13" font-weight="bold" text-anchor="middle" fill="#06B6D4">Analytics & Risk Metrics</text>
    <text x="70" y="340" font-size="11" font-weight="bold" fill="#06B6D4">Core Metrics</text>
    <text x="80" y="358" font-size="10" fill="#ffffff">• Value at Risk (VaR): Portfolio loss probability at confidence level</text>
    <text x="80" y="373" font-size="10" fill="#ffffff">• Sharpe Ratio: Risk-adjusted return metric</text>
    <text x="80" y="388" font-size="10" fill="#ffffff">• Portfolio Beta: Systemic risk exposure</text>
    
    <text x="70" y="415" font-size="11" font-weight="bold" fill="#06B6D4">Real-Time Processing</text>
    <text x="80" y="433" font-size="10" fill="#ffffff">• Update metrics every second with new market prices</text>
    <text x="80" y="448" font-size="10" fill="#ffffff">• Calculate portfolio risk exposure in real-time</text>
    
    <text x="70" y="475" font-size="11" font-weight="bold" fill="#06B6D4">Benefit</text>
    <text x="80" y="493" font-size="10" fill="#ffffff">Portfolio managers make data-driven decisions with up-to-date risk metrics</text></g>
  
  <defs><marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0 0, 12 6, 0 12" fill="#06B6D4"/></marker></defs>
</svg>
