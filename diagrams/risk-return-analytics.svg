<svg viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-size: 28px; font-weight: bold; fill: #ffffff; }
    .subtitle { font-size: 14px; fill: #06B6D4; }
    .section-title { font-size: 13px; font-weight: bold; fill: #06B6D4; }
    .label { font-size: 12px; font-weight: bold; fill: #ffffff; }
    .text { font-size: 11px; fill: #ffffff; }
    .box { stroke: #4B5563; stroke-width: 2; rx: 6; }
  </style>
  <rect width="1400" height="700" fill="#111827"/>
  <text x="700" y="40" class="title" text-anchor="middle">Risk/Return Analytics Platform</text>
  <text x="700" y="60" class="subtitle" text-anchor="middle">Real-time portfolio risk analysis with sophisticated financial metrics</text>
  
  <!-- Main Flow -->
  <rect x="50" y="100" width="130" height="80" fill="#3B82F6" class="box"/><text x="115" y="130" class="label" text-anchor="middle">Market</text><text x="115" y="150" class="label" text-anchor="middle">Data Feed</text><text x="115" y="170" class="text" text-anchor="middle">Real-time</text>
  <path d="M 180 140 L 240 140" stroke="#06B6D4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="240" y="100" width="130" height="80" fill="#8B5CF6" class="box"/><text x="305" y="130" class="label" text-anchor="middle">Time Series</text><text x="305" y="150" class="label" text-anchor="middle">Database</text><text x="305" y="170" class="text" text-anchor="middle">High-throughput</text>
  <path d="M 370 140 L 430 140" stroke="#06B6D4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="430" y="100" width="130" height="80" fill="#EC4899" class="box"/><text x="495" y="130" class="label" text-anchor="middle">Analytics</text><text x="495" y="150" class="label" text-anchor="middle">Engine</text><text x="495" y="170" class="text" text-anchor="middle">Risk models</text>
  <path d="M 560 140 L 620 140" stroke="#06B6D4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="620" y="100" width="130" height="80" fill="#F59E0B" class="box"/><text x="685" y="130" class="label" text-anchor="middle">Reporting &</text><text x="685" y="150" class="label" text-anchor="middle">Dashboards</text><text x="685" y="170" class="text" text-anchor="middle">Portfolio view</text>
  <path d="M 750 140 L 810 140" stroke="#06B6D4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="810" y="100" width="130" height="80" fill="#10B981" class="box"/><text x="875" y="130" class="label" text-anchor="middle">Risk Alerts &</text><text x="875" y="150" class="label" text-anchor="middle">Notifications</text><text x="875" y="170" class="text" text-anchor="middle">Threshold-based</text>
  
  <!-- Details -->
  <g>
    <rect x="50" y="240" width="1300" height="420" fill="#1F2937" class="box" stroke="#06B6D4"/>
    <text x="700" y="270" class="section-title" text-anchor="middle">Financial Analytics & Risk Metrics</text>
    
    <rect x="70" y="290" width="400" height="140" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" rx="4"/>
    <text x="270" y="315" class="section-title" text-anchor="middle">Core Risk Metrics</text>
    <text x="80" y="340" class="text">✓ Value at Risk (VaR)</text>
    <text x="80" y="358" class="text">  Portfolio loss at confidence level</text>
    <text x="80" y="376" class="text">✓ Sharpe Ratio</text>
    <text x="80" y="394" class="text">  Risk-adjusted return measurement</text>
    <text x="80" y="412" class="text">✓ Portfolio Beta (systemic risk)</text>
    
    <rect x="510" y="290" width="400" height="140" fill="#0F172A" stroke="#EC4899" stroke-width="1.5" rx="4"/>
    <text x="710" y="315" class="section-title" text-anchor="middle">Real-Time Processing</text>
    <text x="520" y="340" class="text">✓ Update metrics every second</text>
    <text x="520" y="358" class="text">✓ New market prices ingested</text>
    <text x="520" y="376" class="text">✓ Recalculate portfolio exposure</text>
    <text x="520" y="394" class="text">✓ Check against risk thresholds</text>
    <text x="520" y="412" class="text">✓ Trigger alerts if violated</text>
    
    <rect x="950" y="290" width="380" height="140" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" rx="4"/>
    <text x="1140" y="315" class="section-title" text-anchor="middle">Data Pipeline</text>
    <text x="960" y="340" class="text">✓ Market data: 1000s quotes/sec</text>
    <text x="960" y="358" class="text">✓ Time series: hour, day, year</text>
    <text x="960" y="376" class="text">✓ Analytics: advanced computations</text>
    <text x="960" y="394" class="text">✓ Dashboards: live visualization</text>
    <text x="960" y="412" class="text">✓ Alerts: sub-second notification</text>
    
    <rect x="70" y="460" width="1260" height="180" fill="#0F172A" stroke="#10B981" stroke-width="1.5" rx="4"/>
    <text x="700" y="485" class="section-title" text-anchor="middle">Portfolio Management Capabilities</text>
    <text x="80" y="510" class="text">Real-Time Risk Exposure: Portfolio managers see live risk metrics, enabling quick decisions on rebalancing.</text>
    <text x="80" y="528" class="text">Threshold-Based Alerts: Automatic notifications when VaR exceeds limits or portfolio drift detected.</text>
    <text x="80" y="546" class="text">Historical Analytics: Time-series data supports trend analysis, backtesting, and performance attribution.</text>
    <text x="80" y="564" class="text">Stress Testing: Simulate market scenarios to understand portfolio behavior under extreme conditions.</text>
    <text x="80" y="582" class="text">Compliance Reporting: Automated reports for regulatory requirements and internal governance policies.</text>
  </g>
  
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0 0, 12 6, 0 12" fill="#06B6D4"/></marker></defs>
</svg>
