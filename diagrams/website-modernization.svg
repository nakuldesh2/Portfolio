<svg viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-size: 28px; font-weight: bold; fill: #ffffff; }
    .subtitle { font-size: 14px; fill: #06B6D4; }
    .section-title { font-size: 13px; font-weight: bold; fill: #06B6D4; }
    .label { font-size: 12px; font-weight: bold; fill: #ffffff; }
    .text { font-size: 11px; fill: #ffffff; }
    .box { stroke: #4B5563; stroke-width: 2; rx: 6; }
  </style>
  <rect width="1400" height="700" fill="#111827"/>
  <text x="700" y="40" class="title" text-anchor="middle">Website Modernization - Strangler Pattern</text>
  <text x="700" y="60" class="subtitle" text-anchor="middle">Gradual migration from monolithic legacy system to modern microservices architecture</text>
  
  <!-- Main Flow -->
  <rect x="60" y="100" width="130" height="80" fill="#8B5A3C" class="box"/><text x="125" y="135" class="label" text-anchor="middle">Legacy</text><text x="125" y="153" class="label" text-anchor="middle">Monolith</text><text x="125" y="171" class="text" text-anchor="middle">15+ years</text>
  <path d="M 190 140 L 250 140" stroke="#06B6D4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="220" y="130" class="text">Strangler</text>
  <rect x="250" y="100" width="130" height="80" fill="#3B82F6" class="box"/><text x="315" y="135" class="label" text-anchor="middle">API</text><text x="315" y="153" class="label" text-anchor="middle">Gateway</text><text x="315" y="171" class="text" text-anchor="middle">50/50 split</text>
  <path d="M 380 120 L 440 100" stroke="#06B6D4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 380 160 L 440 180" stroke="#06B6D4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="440" y="60" width="130" height="80" fill="#10B981" class="box"/><text x="505" y="100" class="label" text-anchor="middle">New Services</text><text x="505" y="120" class="text" text-anchor="middle">Kubernetes</text>
  <rect x="440" y="180" width="130" height="80" fill="#8B5A3C" class="box"/><text x="505" y="220" class="label" text-anchor="middle">Legacy System</text><text x="505" y="240" class="text" text-anchor="middle">Still running</text>
  
  <!-- Details -->
  <g>
    <rect x="50" y="320" width="1300" height="340" fill="#1F2937" class="box" stroke="#06B6D4"/>
    <text x="700" y="350" class="section-title" text-anchor="middle">Strangler Pattern Migration Strategy</text>
    
    <rect x="70" y="370" width="400" height="120" fill="#0F172A" stroke="#10B981" stroke-width="1.5" rx="4"/>
    <text x="270" y="395" class="section-title" text-anchor="middle">Phase 1: Infrastructure</text>
    <text x="80" y="420" class="text">✓ Deploy modern services to K8s</text>
    <text x="80" y="438" class="text">✓ Set up data sync bidirectional</text>
    <text x="80" y="456" class="text">✓ Implement API Gateway</text>
    <text x="80" y="474" class="text">✓ Configure health checks</text>
    
    <rect x="510" y="370" width="400" height="120" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" rx="4"/>
    <text x="710" y="395" class="section-title" text-anchor="middle">Phase 2: Traffic Shift</text>
    <text x="520" y="420" class="text">✓ Route 10% → 25% → 50% → 75% → 100%</text>
    <text x="520" y="438" class="text">✓ Monitor metrics at each step</text>
    <text x="520" y="456" class="text">✓ Rollback capability at all times</text>
    <text x="520" y="474" class="text">✓ Gradual customer exposure</text>
    
    <rect x="950" y="370" width="380" height="120" fill="#0F172A" stroke="#EC4899" stroke-width="1.5" rx="4"/>
    <text x="1140" y="395" class="section-title" text-anchor="middle">Phase 3: Decommission</text>
    <text x="960" y="420" class="text">✓ Shut down old monolith</text>
    <text x="960" y="438" class="text">✓ Archive legacy data</text>
    <text x="960" y="456" class="text">✓ Remove technical debt</text>
    <text x="960" y="474" class="text">✓ Cost savings realized</text>
    
    <rect x="70" y="520" width="1260" height="120" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5" rx="4"/>
    <text x="700" y="545" class="section-title" text-anchor="middle">Key Benefits & Risk Mitigation</text>
    <text x="80" y="570" class="text">Zero-Downtime Migration: Services remain available throughout migration. No customer impact.</text>
    <text x="80" y="588" class="text">Rollback at Any Time: If issues detected, revert traffic back to legacy system instantly.</text>
    <text x="80" y="606" class="text">Gradual Technology Adoption: Team learns new architecture incrementally, reducing training burden.</text>
  </g>
  
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0 0, 12 6, 0 12" fill="#06B6D4"/></marker></defs>
</svg>
